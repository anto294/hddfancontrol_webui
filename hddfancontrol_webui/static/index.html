<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hddfancontrol</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0b1528">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="hddfancontrol">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js" defer></script>
  <script src="/static/icons.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/fans.js" defer></script>
  <script src="/static/drives.js" defer></script>
  <script src="/static/history.js" defer></script>
  <script src="/static/settings.js" defer></script>
  <script src="/static/security.js" defer></script>
  <script src="/static/wizard.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/static/logo.png" alt="" width="36" height="36">
      <h1>hddfancontrol</h1>
      <span id="mode" class="pill"></span>
      <button type="button" class="link open-wizard" data-icon="wizard" data-i18n="wizard.open"></button>
      <div class="lang"></div>
      <button id="logout" class="link" data-icon="logout" data-i18n="action.logout"></button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" data-icon="overview" data-i18n="tab.overview"></button>
      <button role="tab" data-tab="fans" data-icon="fans" data-i18n="tab.fans"></button>
      <button role="tab" data-tab="smart" data-icon="smart" data-i18n="tab.smart"></button>
      <button role="tab" data-tab="history" data-icon="history" data-i18n="tab.history"></button>
      <button role="tab" data-tab="settings" data-icon="settings" data-i18n="tab.settings"></button>
      <button role="tab" data-tab="pwmtest" data-icon="pwmtest" data-i18n="tab.pwmtest"></button>
      <button role="tab" data-tab="security" data-icon="security" data-i18n="tab.security"></button>
      <button role="tab" data-tab="logs" data-icon="logs" data-i18n="tab.logs"></button>
    </nav>
  </header>

  <main>
    <div id="banners"></div>

    <!-- Overview -->
    <section id="tab-overview" class="tab">
      <div class="stats">
        <div class="stat" id="stat-hottest">
          <span class="stat-icon" data-icon="thermometer"></span>
          <span class="stat-label" data-i18n="overview.hottest"></span>
          <strong class="stat-value"></strong>
        </div>
        <div class="stat" id="stat-fans">
          <span class="stat-icon" data-icon="fan"></span>
          <span class="stat-label" data-i18n="overview.fan_average"></span>
          <strong class="stat-value"></strong>
        </div>
        <div class="stat" id="stat-drives">
          <span class="stat-icon" data-icon="drive"></span>
          <span class="stat-label" data-i18n="overview.drives_awake"></span>
          <strong class="stat-value"></strong>
        </div>
      </div>
      <article class="card" id="bay-card" hidden>
        <h2 data-icon="bays" data-i18n="bays.title"></h2>
        <div id="bay-map" class="bays"></div>
      </article>
      <article class="card">
        <div class="card-head">
          <h2 data-icon="drive" data-i18n="overview.drives"></h2>
          <p class="muted small" id="latest-time"></p>
        </div>
        <div class="meters columns" id="drive-temps"></div>
      </article>
      <div class="grid">
        <article class="card">
          <h2 data-icon="fan" data-i18n="overview.fans"></h2>
          <div class="meters" id="fan-summary"></div>
        </article>
        <article class="card">
          <h2 data-icon="chip" data-i18n="overview.control"></h2>
          <table class="list" id="control"></table>
          <div class="actions">
            <button id="restart" class="secondary" data-icon="restart" data-i18n="action.restart"></button>
          </div>
        </article>
      </div>
    </section>

    <!-- Guided setup (wizard.js) -->
    <section id="tab-setup" class="tab" hidden>
      <article class="card wizard">
        <div id="setup-progress"></div>
        <div id="setup-body"></div>
      </article>
    </section>

    <!-- Fans: manual control -->
    <section id="tab-fans" class="tab" hidden>
      <article class="card">
        <div class="card-head">
          <h2 data-icon="fan" data-i18n="fans.title"></h2>
          <button id="manual-toggle"></button>
        </div>
        <details class="help">
          <summary data-i18n="fans.how"></summary>
          <p class="muted" data-i18n="fans.intro"></p>
        </details>
        <p class="warning" id="manual-safety" data-i18n="fans.safety" hidden></p>
        <div id="fan-list"></div>
      </article>
    </section>

    <!-- SMART -->
    <section id="tab-smart" class="tab" hidden>
      <article class="card">
        <div class="card-head">
          <h2 data-icon="smart" data-i18n="smart.title"></h2>
          <button id="smart-refresh" class="secondary" data-icon="restart" data-i18n="action.refresh_smart"></button>
        </div>
        <p class="muted small" data-i18n="smart.intro"></p>
      </article>
      <article class="card">
        <details id="bay-edit">
          <summary data-i18n="bays.edit"></summary>
          <p class="muted small" data-i18n="bays.help"></p>
          <div class="fields">
            <label class="field"><span data-i18n="bays.rows"></span><input type="number" id="bay-rows" min="0" max="12"></label>
            <label class="field"><span data-i18n="bays.cols"></span><input type="number" id="bay-cols" min="0" max="12"></label>
          </div>
          <div id="bay-editor" class="bays"></div>
          <div class="actions">
            <button type="button" id="bay-save" data-icon="check" data-i18n="bays.save"></button>
            <span id="bay-result" class="small"></span>
          </div>
        </details>
      </article>
      <div id="smart-list" class="grid"></div>
    </section>

    <!-- History -->
    <section id="tab-history" class="tab" hidden>
      <article class="card">
        <div class="card-head">
          <h2 data-icon="thermometer" data-i18n="history.temps"></h2>
          <div class="actions-inline">
          <select id="history-hours" aria-label="Window">
            <option value="1">1 h</option>
            <option value="6" selected>6 h</option>
            <option value="24">24 h</option>
            <option value="168">7 d</option>
            <option value="720">30 d</option>
            <option value="2160">90 d</option>
            <option value="8760">1 y</option>
          </select>
          <a id="history-csv" class="button secondary" href="/api/history.csv?hours=6" download data-icon="download" data-i18n="history.csv"></a>
          </div>
        </div>
        <p class="muted small" data-i18n="history.hint"></p>
        <div id="chart-temp" class="chart"></div>
      </article>
      <article class="card">
        <h2 data-icon="fan" data-i18n="history.rpm"></h2>
        <div id="chart-rpm" class="chart"></div>
      </article>
      <article class="card">
        <h2 data-icon="history" data-i18n="history.pwm"></h2>
        <div id="chart-pwm" class="chart"></div>
      </article>
    </section>

    <!-- Settings -->
    <section id="tab-settings" class="tab" hidden>
      <form id="settings-form" novalidate>
        <p class="muted" id="settings-source"></p>

        <article class="card">
          <h2 data-icon="thermometer" data-i18n="settings.mode"></h2>
          <div class="fields">
            <label class="field"><span data-i18n="settings.control_mode"></span>
              <select name="control_mode">
                <option value="curve" data-i18n="mode.curve"></option>
                <option value="auto" data-i18n="mode.auto"></option>
              </select></label>
            <label class="field"><span data-i18n="settings.drive_temp_min"></span>
              <input type="number" name="drive_temp_min" step="0.5" min="0" max="120">
              <small class="error" data-error="drive_temp_min"></small></label>
            <label class="field"><span data-i18n="settings.target_temp"></span>
              <input type="number" name="target_temp" step="0.5" min="0" max="120">
              <small class="error" data-error="target_temp"></small></label>
            <label class="field"><span data-i18n="settings.drive_temp_max"></span>
              <input type="number" name="drive_temp_max" step="0.5" min="0" max="120">
              <small class="error" data-error="drive_temp_max"></small></label>
            <label class="field"><span data-i18n="settings.min_fan_speed_prct"></span>
              <input type="number" name="min_fan_speed_prct" min="0" max="100">
              <small class="error" data-error="min_fan_speed_prct"></small></label>
          </div>
          <div id="curve-chart" class="chart curve" aria-hidden="true"></div>
          <p class="muted small" id="mode-help"></p>
          <p class="muted small" data-i18n="settings.min_speed_warning"></p>
        </article>

        <article class="card">
          <h2 data-icon="drive" data-i18n="settings.drives"></h2>
          <p class="muted small" data-i18n="settings.drives_help"></p>
          <table class="list form-table" id="drive-list"></table>
          <label class="field">
            <span data-i18n="settings.other_drives"></span>
            <input type="text" id="other-drives" spellcheck="false" autocomplete="off">
            <small class="muted" data-i18n="settings.other_drives_help"></small>
          </label>
          <p class="error" data-error="drives"></p>
          <p class="error" data-error="monitor_drives"></p>
          <p class="error" data-error="spin_down_drives"></p>
        </article>

        <article class="card">
          <h2 data-icon="fan" data-i18n="settings.fans"></h2>
          <p class="muted small" data-i18n="settings.fans_help"></p>
          <table class="list form-table" id="pwm-list"></table>
          <p class="error" data-error="pwms"></p>
        </article>

        <article class="card">
          <h2 data-icon="fans" data-i18n="settings.groups"></h2>
          <p class="muted small" data-i18n="settings.groups_help"></p>
          <div id="group-list" class="groups"></div>
        </article>

        <article class="card">
          <h2 data-icon="thermometer" data-i18n="settings.limits"></h2>
          <p class="muted small" data-i18n="settings.limits_help"></p>
          <div class="table-scroll"><table class="list form-table" id="limit-list"></table></div>
          <p class="error" data-error="drive_limits"></p>
        </article>

        <article class="card">
          <h2 data-icon="moon" data-i18n="settings.spin_down"></h2>
          <div class="fields">
            <label class="field"><span data-i18n="settings.spin_down_time_s"></span>
              <input type="number" name="spin_down_time_s" min="0" max="86400">
              <small class="muted" data-i18n="settings.spin_down_help"></small>
              <small class="error" data-error="spin_down_time_s"></small></label>
            <label class="field"><span data-i18n="settings.spin_down_command"></span>
              <select name="spin_down_command"><option>ata</option><option>scsi</option></select>
              <small class="muted" data-i18n="settings.spin_down_command_help"></small></label>
          </div>
        </article>

        <article class="card">
          <h2 data-icon="chip" data-i18n="settings.hwmons"></h2>
          <p class="muted small" data-i18n="settings.hwmons_help"></p>
          <table class="list form-table" id="hwmon-list"></table>
          <p class="error" data-error="hwmons"></p>
        </article>

        <article class="card">
          <h2 data-icon="bell" data-i18n="settings.notify"></h2>
          <p class="muted small" data-i18n="settings.notify_help"></p>
          <div class="fields">
            <label class="field wide"><span data-i18n="settings.notify_url"></span>
              <input type="url" name="notify_url" spellcheck="false" autocomplete="off" placeholder="https://ntfy.sh/…">
              <small class="muted" data-i18n="settings.notify_url_help"></small>
              <small class="error" data-error="notify_url"></small></label>
            <label class="field"><span data-i18n="settings.notify_format"></span>
              <select name="notify_format">
                <option value="ntfy">ntfy</option>
                <option value="gotify">Gotify</option>
                <option value="json">JSON (webhook)</option>
              </select></label>
            <label class="field"><span data-i18n="settings.notify_language"></span>
              <select name="notify_language">
                <option value="en">English</option>
                <option value="it">Italiano</option>
              </select></label>
            <label class="field"><span data-i18n="settings.notify_repeat_h"></span>
              <input type="number" name="notify_repeat_h" min="0" max="168">
              <small class="muted" data-i18n="settings.notify_repeat_help"></small>
              <small class="error" data-error="notify_repeat_h"></small></label>
          </div>
          <div class="actions">
            <button type="button" id="notify-test" class="secondary" data-icon="bell" data-i18n="action.notify_test"></button>
            <span id="notify-result" class="small"></span>
          </div>
        </article>

        <article class="card">
          <h2 data-icon="calendar" data-i18n="settings.schedules"></h2>
          <p class="muted small" data-i18n="settings.schedules_help"></p>
          <p class="muted small"><code class="cron-syntax" data-i18n="settings.cron_syntax"></code></p>
          <div class="fields">
            <label class="field"><span data-i18n="settings.smart_schedule"></span>
              <input type="text" name="smart_schedule" class="cron" list="cron-smart_schedule" autocomplete="off" spellcheck="false" autocapitalize="off">
              <datalist id="cron-smart_schedule"></datalist>
              <small class="cron-preview" data-cron-preview="smart_schedule"></small>
              <small class="muted" data-i18n="settings.smart_schedule_help"></small>
              <small class="error" data-error="smart_schedule"></small></label>
            <label class="field"><span data-i18n="settings.selftest_short"></span>
              <input type="text" name="selftest_short" class="cron" list="cron-selftest_short" autocomplete="off" spellcheck="false" autocapitalize="off">
              <datalist id="cron-selftest_short"></datalist>
              <small class="cron-preview" data-cron-preview="selftest_short"></small>
              <small class="muted" data-i18n="settings.selftest_short_help"></small>
              <small class="error" data-error="selftest_short"></small></label>
            <label class="field"><span data-i18n="settings.selftest_long"></span>
              <input type="text" name="selftest_long" class="cron" list="cron-selftest_long" autocomplete="off" spellcheck="false" autocapitalize="off">
              <datalist id="cron-selftest_long"></datalist>
              <small class="cron-preview" data-cron-preview="selftest_long"></small>
              <small class="muted" data-i18n="settings.selftest_long_help"></small>
              <small class="error" data-error="selftest_long"></small></label>
            <label class="field"><span data-i18n="settings.notify_summary"></span>
              <input type="text" name="notify_summary" class="cron" list="cron-notify_summary" autocomplete="off" spellcheck="false" autocapitalize="off">
              <datalist id="cron-notify_summary"></datalist>
              <small class="cron-preview" data-cron-preview="notify_summary"></small>
              <small class="muted" data-i18n="settings.notify_summary_help"></small>
              <small class="error" data-error="notify_summary"></small></label>
            <label class="field"><span data-i18n="settings.notify_quiet"></span>
              <input type="text" name="notify_quiet" class="cron" list="cron-notify_quiet" autocomplete="off" spellcheck="false" autocapitalize="off">
              <datalist id="cron-notify_quiet"></datalist>
              <small class="cron-preview" data-cron-preview="notify_quiet"></small>
              <small class="muted" data-i18n="settings.notify_quiet_help"></small>
              <small class="error" data-error="notify_quiet"></small></label>
          </div>
        </article>

        <article class="card">
          <h2 data-icon="settings" data-i18n="settings.advanced"></h2>
          <div class="fields">
            <label class="field"><span data-i18n="settings.interval_s"></span>
              <input type="number" name="interval_s" min="1" max="3600">
              <small class="error" data-error="interval_s"></small></label>
            <label class="field"><span data-i18n="settings.average"></span>
              <input type="number" name="average" min="1" max="100">
              <small class="error" data-error="average"></small></label>
            <label class="field"><span data-i18n="settings.history_days"></span>
              <input type="number" name="history_days" min="1" max="365">
              <small class="error" data-error="history_days"></small></label>
            <label class="field"><span data-i18n="settings.verbosity"></span>
              <select name="verbosity">
                <option>TRACE</option><option>DEBUG</option><option>INFO</option><option>WARN</option><option>ERROR</option>
              </select></label>
          </div>
          <label class="check"><input type="checkbox" name="restore_fan_settings">
            <span data-i18n="settings.restore_fan_settings"></span></label>
        </article>

        <article class="card">
          <h2 data-icon="backup" data-i18n="settings.backup"></h2>
          <p class="muted small" data-i18n="settings.backup_help"></p>
          <div class="actions">
            <button type="button" id="export-settings" class="secondary" data-icon="download" data-i18n="action.export"></button>
            <button type="button" id="import-settings" class="secondary" data-icon="upload" data-i18n="action.import"></button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
            <span id="backup-result" class="small"></span>
          </div>
        </article>

        <div class="actions sticky">
          <button type="submit" data-i18n="action.save"></button>
          <button type="button" id="reset-settings" class="secondary" data-i18n="action.reset"></button>
          <button type="button" class="secondary open-wizard" data-icon="wizard" data-i18n="wizard.open"></button>
          <span id="save-result" class="small"></span>
        </div>
      </form>
    </section>

    <!-- PWM test -->
    <section id="tab-pwmtest" class="tab" hidden>
      <article class="card">
        <h2 data-icon="pwmtest" data-i18n="pwmtest.title"></h2>
        <p data-i18n="pwmtest.intro"></p>
        <p class="warning" data-i18n="pwmtest.warning"></p>
        <div id="pwmtest-list" class="checklist"></div>
        <div class="actions">
          <button id="pwmtest-start" data-i18n="action.start_test"></button>
          <button id="pwmtest-cancel" class="danger" data-i18n="action.cancel_test"></button>
        </div>
      </article>
      <article class="card">
        <h2 data-icon="check" data-i18n="pwmtest.results"></h2>
        <table class="list" id="pwmtest-results"></table>
        <p id="pwmtest-stopped" class="error" hidden></p>
        <div class="actions">
          <button id="pwmtest-use" class="secondary" data-i18n="action.use_results"></button>
        </div>
      </article>
    </section>

    <!-- Security -->
    <section id="tab-security" class="tab" hidden>
      <article class="card">
        <h2 data-icon="security" data-i18n="security.title"></h2>
        <p id="security-state"></p>
        <form id="auth-form" class="fields narrow" novalidate autocomplete="on">
          <label class="field" id="current-field"><span data-i18n="security.current"></span>
            <input type="password" name="current" autocomplete="current-password"></label>
          <label class="field"><span data-i18n="security.username"></span>
            <input type="text" name="username" autocomplete="username" spellcheck="false"></label>
          <label class="field"><span data-i18n="security.password"></span>
            <input type="password" name="password" autocomplete="new-password" minlength="8"></label>
          <label class="field"><span data-i18n="security.confirm"></span>
            <input type="password" name="confirm" autocomplete="new-password"></label>
          <div class="actions">
            <button type="submit" data-i18n="action.save_credentials"></button>
            <span id="auth-result" class="small"></span>
          </div>
        </form>
      </article>
    </section>

    <!-- Logs -->
    <section id="tab-logs" class="tab" hidden>
      <article class="card">
        <div class="card-head">
          <h2 data-icon="logs" data-i18n="tab.logs"></h2>
          <select id="log-source" aria-label="Source">
            <option value="" data-i18n="logs.all"></option>
            <option>hddfancontrol</option>
            <option>hd-idle</option>
            <option>fan-control</option>
            <option>pwm-test</option>
            <option>sensors</option>
            <option>temps</option>
            <option>alerts</option>
            <option>webui</option>
          </select>
        </div>
        <pre id="log" class="log" tabindex="0"></pre>
      </article>
    </section>
  </main>

  <footer class="muted small">
    <span id="version"></span> ·
    <a href="https://github.com/anto294/hddfancontrol_webui" rel="noopener noreferrer" target="_blank">GitHub</a>
  </footer>
</body>
</html>
