[flake8]
max-line-length = 220
max-complexity = 15
exclude = ./.git,
          ./.github,
          ./build,
          __pycache__,
          .venv

[tool:pytest]
testpaths = tests
pythonpath = . tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

[mypy]
strict = true
python_version = 3.11
files = hddfancontrol_webui
