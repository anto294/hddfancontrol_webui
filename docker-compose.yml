# Example for Docker Compose, and for a Custom App on TrueNAS SCALE
# (Apps → Discover Apps → ⋮ → Install via YAML).
services:
  hddfancontrol:
    image: ghcr.io/anto294/hddfancontrol_webui:latest
    container_name: hddfancontrol
    restart: unless-stopped
    # The fans and the drives are on the host. Privileged is needed to write
    # the PWM files of /sys and to send ATA commands to the drives. Only the
    # core runs as root; the web server runs as an unprivileged user and
    # reaches the core through a Unix socket after the login.
    privileged: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: false # the image has its own init (tini)
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config # settings, labels, history, credentials
      - /lib/modules:/lib/modules:ro # to load the sensor chip module
      - /dev:/dev:ro # to see the drives by their stable names
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      # Without credentials, the first visit asks for the setup code written
      # in the log of the container (docker logs hddfancontrol), then for a
      # username and a password. These variables, when set, win over them.
      # - WEBUI_USERNAME=admin
      # - WEBUI_PASSWORD=a-long-password-of-yours
      # The networks allowed to connect: private ones by default.
      # - WEBUI_ALLOW=192.168.1.0/24  # or "private 2a02:…::/64" to add a network to the default ones
      # Everything else can be set in the web UI, or here, for example:
      # - DRIVES=/dev/disk/by-id/ata-ST4000VN006-3CW104_ZW627CWW
      # - MONITOR_DRIVES=/dev/disk/by-id/ata-ST4000VN006-3CW104_ZW627CWW
      # - PWM=/sys/class/hwmon/hwmon3/pwm1:200:75
      # - DRIVE_TEMP_RANGE=40 60
      # - SPIN_DOWN_TIME_S=600
      # - NOTIFY_URL=https://ntfy.sh/a-topic-of-yours
      # - TZ=Europe/Rome
      # HTTPS is on, on the same port as HTTP (a self-signed certificate is
      # made in /config/web/tls). Send every browser to it, or turn it off:
      # - FORCE_HTTPS=true
      # - ENABLE_TLS=false
    # Two Python processes (core and gateway, about 45 MB each), a login's
    # 16 MB scrypt, the daemons and smartctl: room to spare, so the kernel
    # never has to kill the core that drives the fans.
    mem_limit: 256m
