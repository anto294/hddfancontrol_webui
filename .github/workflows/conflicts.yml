name: Merge conflicts

on:
  # A push to main can make open pull requests conflict.
  push:
    branches: [main]
  # pull_request_target so the label can also be set on pull requests from
  # forks. Safe here: the workflow never checks out or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  label:
    name: Label conflicting pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A few lines of gh instead of a third-party action: nothing but the
      # GitHub CLI of the runner runs with this token, and no PR code at all.
      - name: Label pull requests with merge conflicts
        run: |
          gh pr list --state open --limit 100 --json number --jq '.[].number' | while read -r number; do
            # GitHub works out "mergeable" in the background: UNKNOWN until then.
            state=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              state=$(gh pr view "$number" --json mergeable --jq .mergeable)
              [ "$state" != UNKNOWN ] && break
              sleep 5
            done
            labelled=$(gh pr view "$number" --json labels --jq '[.labels[].name] | index("conflict") != null')
            echo "#$number: $state (labelled: $labelled)"
            if [ "$state" = CONFLICTING ] && [ "$labelled" = false ]; then
              gh pr edit "$number" --add-label conflict
            elif [ "$state" = MERGEABLE ] && [ "$labelled" = true ]; then
              gh pr edit "$number" --remove-label conflict
            fi
          done
