name: Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    name: Claude code review
    # Drafts aren't ready for review yet; they get one once marked ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Secrets aren't exposed to PRs from forks or Dependabot, and the repo
      # may not have the key configured at all: skip cleanly instead of
      # failing the check in all of those cases.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not available, skipping automated review."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The project is a Python (aiohttp) web
            UI that runs as root, in a privileged container or a systemd
            service, and drives the fans of a NAS through /sys PWM files.
            Pay particular attention to: values from HTTP requests reaching
            a command line or a file path without the checks of settings.py;
            authentication, session and CSRF handling in web.py and auth.py;
            any path where a fan could stay stopped while drives heat up
            (fancontrol.py safety rules, restore of pwmN_enable); processes
            that could outlive a stop; blocking calls on the event loop.
            In the JavaScript, server data must never be inserted as HTML.

            Formatting, types and lint are already enforced by CI: don't
            comment on style. Only report real problems, as inline comments
            on the relevant lines, plus one short summary comment. If you
            find nothing worth flagging, say so in one line.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
