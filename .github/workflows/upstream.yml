name: Upstream versions

on:
  schedule:
    # Weekly: hddfancontrol and hd-idle are pinned in the Dockerfile, and
    # Dependabot cannot see them.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  check:
    name: Check hddfancontrol and hd-idle releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Open an issue for each newer release
        run: |
          check() {
            arg="$1" commit_arg="$2" repo="$3"
            pinned=$(sed -n "s/^ARG $arg=//p" Dockerfile)
            latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
            echo "$repo: pinned $pinned, latest $latest"
            [ "$pinned" = "$latest" ] && return 0
            title="Update $repo to $latest"
            if gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number' | grep -q .; then
              echo "An issue is already open: $title"
              return 0
            fi
            # The commit the tag points to (the dereferenced one for an annotated tag).
            commit=$(git ls-remote "https://github.com/$repo.git" "refs/tags/$latest^{}" "refs/tags/$latest" \
              | sort -k2 -r | head -n 1 | cut -f1)
            gh issue create --title "$title" --label dependencies --body \
              "The Dockerfile pins \`$arg=$pinned\`, and [$repo](https://github.com/$repo/releases/tag/$latest) released \`$latest\`, commit \`$commit\` today. Read its changes, update \`$arg=$latest\` and \`$commit_arg=$commit\` (check the commit with \`git ls-remote https://github.com/$repo.git 'refs/tags/$latest^{}' 'refs/tags/$latest'\`: the build fails when the tag does not point to it), check that the command line in \`settings.py\` still matches, and add an entry to CHANGELOG.md."
          }
          check HDDFANCONTROL_VERSION HDDFANCONTROL_COMMIT desbma/hddfancontrol
          check HDIDLE_VERSION HDIDLE_COMMIT adelolmo/hd-idle
