name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black, flake8, ruff, mypy, JSON, JS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install linters
        run: python -m pip install --upgrade black flake8 ruff mypy aiohttp

      - name: Check formatting with black
        run: black . --check --diff

      - name: Check for syntax errors and undefined names with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report style issues with flake8 (non-blocking)
        run: flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Check for likely bugs with ruff
        run: |
          ruff check hddfancontrol_webui --select E,F,B,ASYNC,S,I --ignore E501
          ruff check tests --select E,F,B,ASYNC,I --ignore E501

      - name: Check types with mypy (strict)
        run: mypy

      - name: Validate JSON files
        run: |
          for f in hddfancontrol_webui/static/i18n/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "::error file=$f::Invalid JSON"; exit 1; }
          done

      - name: Check JavaScript syntax
        run: |
          for f in hddfancontrol_webui/static/*.js; do
            node --check "$f"
          done

  security:
    name: Security (bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install bandit
        run: python -m pip install --upgrade bandit

      - name: Scan with bandit
        run: bandit -r hddfancontrol_webui

  test:
    # 3.11 is the oldest Python of the bare metal package (Debian 12), 3.14
    # the one of the image.
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and the test tools
        run: python -m pip install . pytest pytest-aiohttp pytest-asyncio pytest-cov

      - name: Run tests
        run: python -m pytest -v --cov --cov-report=term-missing --cov-fail-under=95

  shell:
    # actionlint shellchecks the inline run: blocks only; install.sh is a
    # standalone file it never looks at. shellcheck is preinstalled.
    name: shellcheck, hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check install.sh
        run: shellcheck packaging/install.sh

      - name: Check the Dockerfile
        # Pinned by the digest of its multi-arch index.
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --ignore DL3018 - < Dockerfile

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        # The release binary, checked against the SHA-256 pinned here (from the
        # release's checksums file): no script fetched and run from a tag.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" actionlint

      - name: Lint workflows
        run: ./actionlint -color

  image:
    # Build the image for amd64 and start it: the web UI must answer and the
    # three static programs must run. The other architectures are built by
    # docker.yml.
    name: Build and start the image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hddfancontrol_webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the static programs
        run: |
          docker run --rm --entrypoint hddfancontrol hddfancontrol_webui:ci --version
          docker run --rm --entrypoint sdparm hddfancontrol_webui:ci --version
          docker run --rm --entrypoint sh hddfancontrol_webui:ci -c 'hd-idle -h; test -x /usr/local/bin/hd-idle'

      - name: Start the web UI
        run: |
          docker run -d --name webui --read-only --tmpfs /tmp -v "$RUNNER_TEMP/config:/config" \
            -e LOAD_SENSOR_MODULES=false -p 28462:28462 hddfancontrol_webui:ci
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:28462/healthz && break
            sleep 1
          done
          # First start: nothing but the setup, with the code of the log.
          curl -s http://127.0.0.1:28462/api/status | grep -q setup_required
          code=$(docker logs webui 2>&1 | grep -o 'setup code: [0-9a-f-]*' | tail -n 1 | cut -d' ' -f3)
          curl -sf -c "$RUNNER_TEMP/jar" -H 'X-Requested-With: fetch' -H 'Content-Type: application/json' \
            -d "{\"code\":\"$code\",\"username\":\"ci\",\"password\":\"ci-password-1234\"}" \
            http://127.0.0.1:28462/api/setup
          curl -sf -b "$RUNNER_TEMP/jar" http://127.0.0.1:28462/api/status | python3 -m json.tool
          curl -sf -b "$RUNNER_TEMP/jar" http://127.0.0.1:28462/ | grep -q hddfancontrol
          # HTTPS is on by default, on the same port, with a self-signed certificate.
          curl -skf https://127.0.0.1:28462/healthz
          # The web server (the gateway) does not run as root.
          docker exec webui ps -o user,args | grep '[h]ddfancontrol_webui.gateway' | grep -qv '^ *root\b'
          docker stats --no-stream webui
          docker stop webui
          docker logs webui
